version: "3.9"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./public:/var/www/public
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - whatsapp_net

  php:
    build: ./docker/php
    volumes:
      - .:/var/www
    networks:
      - whatsapp_net

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: whatsapp
      MYSQL_USER: whatsapp
      MYSQL_PASSWORD: whatsapp
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./docker/db/01b_friendships.sql:/docker-entrypoint-initdb.d/01b_friendships.sql:ro
      - ./docker/db/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./docker/db/03_status_conversation.sql:/docker-entrypoint-initdb.d/03_status_conversation.sql:ro
    networks:
      - whatsapp_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: whatsapp
      PMA_PASSWORD: whatsapp
    depends_on:
      - db
    networks:
      - whatsapp_net

networks:
  whatsapp_net:

volumes:
  db_data:
